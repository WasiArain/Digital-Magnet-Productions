                                "_uid": "3f0f5fb0-c3fd-473d-a70a-dded68562d07",
                                "list": [{
                                    "_uid": "2705d3ba-32a9-4e1a-bf73-c13c0431c062",
                                    "title": "Generosity",
                                    "component": "description_list_item",
                                    "description": "None of us own a client, an idea or a meeting. In a truly creative culture, we’re all \u2028in service of the problem and the idea."
                                }, {
                                    "_uid": "4f25fc1b-ab11-471a-92d7-5199ffdec233",
                                    "title": "Vulnerability",
                                    "component": "description_list_item",
                                    "description": "It’s great to help. But it’s even more important to be ok about asking for help. To ask the\u2028 stupid question. To offer an idea that \u2028is probably too outrageous to say out loud. We can’t afford to be afraid."
                                }, {
                                    "_uid": "171dcc49-acaa-486d-bd2a-7200d450a514",
                                    "title": "Optimism",
                                    "component": "description_list_item",
                                    "description": "Our business rewards delusional optimism. \u2028The world around us may be crazy\u2028 and sometimes scary. And we can’t always win. And we can’t always do great work. But we need to go into things believing we will."
                                }, {
                                    "_uid": "070f453d-08a3-4729-81b7-75eebd5607c0",
                                    "title": "Honesty",
                                    "component": "description_list_item",
                                    "description": "Nothing really good happens without a lot of honest conversations. Interrogating our work, constantly giving honest and constructive feedback, is critical. You may not always like it in the moment, but later on you’ll be thankful."
                                }, {
                                    "_uid": "f6fa2a2e-d198-4573-911f-f3e0050e2ca3",
                                    "title": "Bravery",
                                    "component": "description_list_item",
                                    "description": "Outrageous results rarely come from a place of total comfort. We have to be ok about having an uncomfortable meeting, a difficult conversation, if it’s in service of the quality of our work."
                                }, {
                                    "_uid": "8c1c3ca1-ee7a-4f08-b98a-451018dee03f",
                                    "title": "Respect",
                                    "component": "description_list_item",
                                    "description": "We have to respect the craft. We have to respect each other. And we have to respect the power we have to do big, beautiful, outrageous things, and try as much as possible not to give in to the temptation of mediocrity."
                                }],
                                "title": "Our \nvalues",
                                "component": "description_list"
                            }],
