                                        },
                                        "content": [{
                                            "text": "With Canadian kids spending less time playing outdoors, TRUE Hockey, in partnership with Dentsu Creative, set out to protect one of Canada's most iconic traditions - street hockey. The result was a fully integrated national campaign that combined cultural insight, technology thinking and advocacy to spark public action.",
                                            "type": "text"

                                "component": "rich_text",

                                            "level": 4,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "A Quiet Erosion of Street Culture",
                                            "type": "text",
                                            "marks": [{
                                                "type": "bold"
                                            }]
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "For generations, street hockey has been a rite of passage in Canadian childhood, but increasing cut-through traffic is changing that, with navigation apps rerouting more drivers through residential streets, resulting in a decline of outdoor play among Canadian youth, with only a small percentage spending meaningful time outside each day. What was once considered a harmless shortcut is now disrupting community life, particularly on neighborhood streets where children gather to play, quietly eroding a long-standing Canadian street hockey culture. TRUE Hockey needed to shine a light on this issue and mobilize Canadians to take back their streets.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        }
                                    }]
                                },

                                "use_accent_color": false

                                "_uid": "4dd40d8a-d7a0-41ae-ac59-501fb11aba68",

                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Approach",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "heading",
                                        "attrs": {
                                            "level": 4,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Taking the Street Back with an Ingenious Hack",
                                            "type": "text",
                                            "marks": [{
                                                "type": "bold"
                                            }]
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Through Game On Ball, we reframed the issue beyond traffic efficiency, positioning rat-running as a threat not just to safety but to a cherished Canadian tradition. Supported by insight from an academic expert on urban mobility, and perspective from hockey gold-medal olympian, Natalie Spooner, on protecting youth play, the campaign invites a broader national conversation about who our streets are designed for. Considering the role and purpose of navigation tools, we explored how technology itself could be used to reframe the conversation. By combining cultural insight, advocacy and symbolic innovation, the campaign aimed to make an invisible issue visible, and give Canadians a simple way to voice their support for play‑friendly streets.",
                                            "type": "text"
                                        }]
                                    }]
                                },
                                "component": "rich_text",
                                "use_accent_color": false
                            }, {
                                "_uid": "efbeddde-cb7f-4742-aaef-07ef4d86e5e4",

                                        "attrs": {
                                            "level": 6,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Solution",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "heading",
                                        "attrs": {
                                            "level": 4,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Change the Navigation Game",
                                            "type": "text",
                                            "marks": [{
                                                "type": "bold"
                                            }]
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "At the center of the campaign is a conceptual technology prototype designed to demonstrate the active play spaces of neighborhoods. The smart, connected street hockey ball signals to routing algorithms that a street is in use, prompting navigation apps to redirect traffic to main roads. While not intended for commercial sale, the concept acted as a catalyst for discussion around how design and technology choices shape everyday life.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "The idea was brought to life through a fully integrated national campaign, including a one‑minute film featuring Olympian and TRUE Hockey athlete Natalie Spooner, supported by social, video, out‑of‑home and PR. Canadians were invited to visit ",
                                            "type": "text"
                                        }, {
                                            "text": "TrueGameOn.com",
                                            "type": "text",
                                            "marks": [{
                                                "type": "link",
                                                "attrs": {
                                                    "href": "https://truegameon.com",
                                                    "uuid": null,
                                                    "anchor": null,
                                                    "target": "_blank",
                                                    "linktype": "url"
                                                }
                                            }]
                                        }, {
                                            "text": " to participate in a national poll, adding their favourite road hockey spots to an interactive heat map and calling on navigation platforms to offer drivers the option to avoid residential neighborhoods - helping communities reclaim their spaces. Beyond driving awareness, the campaign mobilizes communities, with each submission helping to build a visible record across the country that will be shared with technology companies and municipalities, demonstrating how routing decisions impact real communities.",
                                            "type": "text"
                                        }]
                                    }]
                                },

                                                "type": "paragraph",
                                                "content": [{
                                                    "text": "Dentsu Creative Iberia encompasses the very best from Dentsu Creative Spain and Dentsu Creative Portugal. A fusion that unlocks unique synergies in the Iberian Peninsula.",

                                                "type": "paragraph",

                                                }]
                                            }, {
                                                "type": "paragraph",
                                                "content": [{
                                                    "text": "Our vision extends beyond advertising as we seek a more profound impact on people, business, and society. Thus, for each client and project we assemble the best multidisciplinary talent that, through an horizontal integration, assure the capabilities to intersect creative, media and customer experience management (CXM).",

                                                }]
                                            }, {
                                                "type": "paragraph",
                                                "content": [{
                                                    "text": "At Dentsu Creative Iberia, we commit to the mandate of fuelling growth through the power of transformative creativity, addressing today’s challenges whilst setting the pace for tomorrow.",
