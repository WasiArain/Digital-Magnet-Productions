                                        "type": "heading",
                                        "attrs": {
                                            "level": 5,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Grow tourism better, not just bigger",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "For almost twenty years Visit Portugal campaigned to make the country more attractive to international travelers. And it worked. Portugal is now one of the fastest-growing tourist destinations worldwide. That success created a problem: tourism is tightly concentrated. By 2024 protests highlighted the strain on local infrastructure in hotspots such as Lisbon and the Algarve. Lisbon alone accounted for roughly 24% of overnight stays. The brief shifted from simply growing tourism to growing it better. ",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Travel demand is changing: search interest in experiential travel has surged over 2,600%, reflecting a global appetite for meaningful, place-based experiences. At the same time, Visit Portugal needs to spread visitors beyond overstretched hubs so smaller communities capture the economic benefits of tourism. ",
                                            "type": "text"
                                        }]
                                    }]
                                },

                                    }, {
                                        "type": "heading",
                                        "attrs": {
                                            "level": 5,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Turn a global export into a global booking channel",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Portugal sits on a unique advantage. It produces the world's cork and exports significant volumes of wine that already appear on tables around the globe. Yet product familiarity abroad rarely becomes a reason to visit. Millions taste Portuguese wine overseas but very few travel to see where it comes from - the Douro valleys, the Alentejo plains, the Minho mountains. Regions of extraordinary beauty but also extraordinary anonymity. ",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Pairing Portugal was built on that tension. Rather than competing for attention in crowded channels, it turned the export itself into the answer, redirecting visitor interest toward overlooked places and aligning with Visit Portugal's Futourism strategy, a long-term commitment to sustainable, community-benefitting tourism.",
                                            "type": "text"
                                        }]
                                    }]

                                    "copyright": "",

                                    "meta_data": {
                                        "alt": "A person in dark clothing sits on a beach chair with a small table and bottle nearby, set against a large, sunlit rock formation under a clear sky.",
                                        "title": "",

                                }],
                                "component": "slider_content",

                                "no_inner_parallax": false
                            }, {
                                "_uid": "c8710830-0731-4abb-9db7-f5d2b7ecfe22",
                                "text": {
                                    "type": "doc",
                                    "content": [{
                                        "type": "heading",
                                        "attrs": {
                                            "level": 6,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Solution",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "heading",
                                        "attrs": {
                                            "level": 5,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Taste it. Discover it. Book it.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Portugal produces more cork than anywhere else on earth - a global reach, hiding in plain sight. ",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "We realized the humble cork could open far more than a bottle of wine. It could open a doorway to Portugal. So instead of a campaign, we built a channel inside the product itself. We paired one of Portugal's most familiar trades with one of its most innovative startups - Corkified - who were embedding NFC chips in corks to prevent wine fraud. Each chip carries a unique identifier proving a wine's origin and preventing counterfeiting.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Reimagining this technology as a commerce engine, we brought together an entire industry: producers, hoteliers and local communities, into a single, coordinated platform, and brought this to life through the soul of poets. ",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Selecting one hundred wines across national producers and every major Portuguese wine region, from the Douro to the Alentejo to the Azores, we invited one hundred local poets to taste the wine in its region and write an original poem capturing the landscape and the feeling of being there, each paired with a curated stay matched by a team of local experts and chosen to reflect the soul of the region.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "With one tap of a smartphone on the NFC cork, the bottle reveals its story: the wine's origin, the terroir that shaped it, the culture of the exact place it comes from, and a recommended place to stay. No list. No filter. No planning paralysis. One invitation. One tap to confirm.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "The entire end-to-end customer journey: discovery, inspiration, consideration and booking, is compressed into the scan of the cork. The point of inspiration and the point of purchase become the same moment. The product becomes the store. The cork becomes the cashier, and a centuries-old ritual, the opening of a bottle, becomes a travel booking experience.",
                                            "type": "text"
                                        }]
                                    }]
                                },
                                "component": "rich_text",
                                "use_accent_color": false
                            }, {
                                "_uid": "ae340e08-0249-4ca3-89ef-2e543644ac04",
                                "image": {
                                    "id": 182827515178534,
                                    "alt": "Promotional image for \"Pairing Portugal,\" showcasing a wine cork scanning app that links wine with regions in Portugal, featuring four steps and app screens.",

                                        "source": "",

                            }, {
                                "_uid": "e4ebc427-7ed4-4780-a81c-1f233fe499c7",
                                "text": {
                                    "type": "doc",
                                    "content": [{
                                        "type": "heading",
                                        "attrs": {
                                            "level": 6,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Impact",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "heading",
                                        "attrs": {
                                            "level": 5,
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "A System that Scales Naturally and Sustainably",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "Pairing Portugal launched with 100 producers and 100 wine brands. Today, 1,000 tappable bottles are already on tables across priority markets worldwide. For a project embedded in an industry that moves at its own pace, that is a significant start.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "But the real measure is what comes next. Each participating producer releases an estimated 400,000 bottles per harvest. Combined, that's 40 million potential new visits to Portugal, every year. With Portuguese wine exports targeting €1 billion by 2026, the distribution network is already the largest in the world, and it grows with every bottle.",
                                            "type": "text"
                                        }]
                                    }, {
                                        "type": "paragraph",
                                        "attrs": {
                                            "textAlign": null
                                        },
                                        "content": [{
                                            "text": "It is a new way of doing tourism, one that scales with the wine industry and costs nothing to distribute. France. Italy. USA. Australia. Every wine-producing country has the same asset in the hands of its consumers. What started in Portugal could inspire an entirely new way of promoting wine and the world behind every bottle.",
                                            "type": "text"
                                        }]
                                    }]
                                },

                                                    "_uid": "a9af7d85-4805-4329-b71b-f5b2dea94b84",

                                                        "_uid": "f50e10d1-9f7a-4586-9ce4-0a828b1a2f90",
                                                        "quote": "To commemorate the 80th anniversary of the Holocaust and Canal Historia's 25th anniversary, Dentsu Creative Iberia launched \"History Outnumbered.\" At a time when data is used to distort reality, we used it to restore it. This poignant campaign juxtaposes the tattooed numbers of Holocaust survivors with contemporary hate crime statistics, delivering a stark warning: if we don't learn from history, we're doomed to repeat it.",
                                                        "credit": "",
                                                        "component": "quote_block",
                                                        "use_accent_color": true
                                                    }, {
                                                        "_uid": "6ca51145-e1d7-4b17-a93f-115de8cf8b56",

                                                        "_uid": "218fe07d-0ec5-481d-974c-9a15d53800ca",

                                                            "content": [{
                                                                "type": "heading",

                                                                },
                                                                "content": [{
                                                                    "text": "Challenge ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "Confronting the Resurgence of Hate",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "In an era where far-right extremism and hate crimes are alarmingly on the rise, Canal Historia faced the challenge of making historical lessons resonate with today's audience. The goal was to create a campaign that not only commemorated past atrocities but also highlighted their relevance in today's societal context.",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },
                                                        "component": "rich_text",
                                                        "use_accent_color": false
                                                    }, {
                                                        "_uid": "85dc1cac-aeac-418e-9ccd-15048f54de93",

                                                    }, {
                                                        "_uid": "15f84a51-288d-4a64-bfa4-d1eab2a1e41e",
                                                        "text": {
                                                            "type": "doc",
                                                            "content": [{
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 6
                                                                },
                                                                "content": [{
                                                                    "text": "Approach ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "Bridging Past and Present Through Visual Storytelling",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "Dentsu Creative Iberia employed a minimalist yet powerful visual strategy. By overlaying contemporary hate statistics onto images of Holocaust survivors' tattooed numbers, the campaign created a chilling parallel between historical atrocities and current events. This approach served as a visceral reminder of the consequences of unchecked hatred. And while it doesn’t solve extremism, it does something equally powerful: it makes denial impossible.",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },
                                                        "component": "rich_text",
                                                        "use_accent_color": false

                                                                "content": [{
                                                                    "text": "Solution ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "\"History Outnumbered\": A Wake-Up Call",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "The campaign launched across TV, print, and out-of-home platforms, featuring stark visuals that combined survivors' tattoos with present-day hate crime data. Headlines like \"33,963 Racial Hate Crimes in Germany in 2024\" and \"1,856 Likes on the comment 'We miss you, Hitler'\" were superimposed over these images, creating a powerful narrative that history's darkest chapters are at risk of repeating. In a time of rising extremism, it gave Canal Historia a campaign that hit where it mattered, public spaces, mass media, and minds.",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },

                                                                    "text": "Portugal is facing a dramatic housing crisis as a result of several factors: decades of frozen rents, tourism and local rental boom, special policies for immigrants, as well as rampant inflation and low average salaries. ",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "type": "hard_break",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "text": "House prices have become prohibitive - a problem that particularly affects 120,000 young university students and the 500,000 seniors living alone in large houses, in deep loneliness. These were two structural problems to which MEO, the country's largest telecom operator, decided to draw attention with an innovative Christmas campaign.",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }]

                                                                "content": [{
                                                                    "text": "ALL ABOUT PEOPLE",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "MEO, the top Portuguese Telecom has always been a brand of causes, believing it has a responsibility to give back to society. Its communication has always been about people, so it chose to target two key vulnerable groups in the country - students and elderly people. As the Christmas holidays is the peak season for brand advertising, Meo wanted to stand out from the competition with an unifying message that aimed to raise awareness of the problem.",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",

                                                                        }

                                                                }]
                                                            }, {

                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "WHEN A DOOR OPENS, A HEART OPENS TOO",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "We designed a national digital platform that that brought together young students with elderly people who live alone. Taking full advantage of the holiday spirit, what seemed like a typical Christmas campaign was the pretext for launching a platform with an emotional story. Directed by the Oscar-nominated director Marco Martins, we told the story of a student who travels far from home to go to university and shares a house with an elderly woman. Set to Sia's “Angel by the wings”, the film shows their relationship evolve from purely practical into a strong friendship, climaxing with the girl surprising the elderly on Christmas Eve by taking her to ice skating. This beautiful story shows two generations coming together, ending with the line: “When a door opens, a heart opens too”.",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]

                                                                "content": [{
                                                                    "text": "BACK ON THE MAP",
                                                                    "type": "text",

                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "According to the world tourism organization, the numbers of travellers are almost back to normal following the outbreak of Covid-19. But 40 million people with intellectual disabilities across the globe are still shut out. How could Visit Portugal make its cities, stories, traditions and authors accessible to all?",

                                                                }]

                                                                "content": [{
                                                                    "text": "ENABLING TRAVEL THROUGH BOOKS",
                                                                    "type": "text",

                                                                        "type": "textStyle",

                                                                            "color": ""
                                                                        }
                                                                    }]

                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "In 2020, in the midst of lockdown and with the country's borders closed due to the pandemic, Visit Portugal launched Read Portugal, a campaign where people could \"continue to visit\" the Portuguese country by reading its literary classics. It was an initiative to open the country to the world, but how could we take it further to make Portugal truly open to all?",

                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "We created an articifical intellience tool capable of combining text processing with the creation of images to convert any novel into an \"easy-to-read\" book.  This AI tool has been trained following the European standards for making information Easy-to-Read and makes Portuguese literature accessible to people with intellectual disabilities. It reads and synthesizes the original text, simplifying and replacing complex words and rephrasing content into shorter sentences. Additionally, it automatically generates illustrations in order to provide context, while formatting the information following design rules that enhance readability. Then an expert in Easy-to-Read validates the content. By digitizing much of the work that has been done manually the past, making it highly time-consuming and costly, \"translating\" text to make it accessible can be done at speed and scale. Now, with Easy Reading, millions of books, have the potential to be read by everyone.",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },

                                                        "_uid": "6226e4dc-4e1c-4e66-9154-df0ad1809835",
                                                        "quote": "Dentsu Creative Iberia worked with Heinz to design a piece of jewelry specifically to break a chef's number one rule: no ketchup allowed.",
                                                        "credit": "",
                                                        "component": "quote_block",
                                                        "use_accent_color": true
                                                    }, {
                                                        "_uid": "9d98ac48-aba8-4dc9-8dbb-d39c13c231a4",
                                                        "text": {
                                                            "type": "doc",
                                                            "content": [{
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 6
                                                                },
                                                                "content": [{
                                                                    "text": "CHALLENGE",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "Breaking into the Culinary Scene",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "Spain is a country where gastronomy is highly respected. With more than 270 Michelin-starred restaurants, some of the world's best chefs, and a culture that venerates food as if it were a religion, the culinary scene is exceptional. ",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "type": "hard_break",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "text": "However, times are changing, and every day there are more Heinz ketchup fans who are eager to add a touch of their favorite condiment to the most prestigious dishes. The problem? In these restaurants, ketchup is frowned upon.",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }]
                                                        },
                                                        "component": "rich_text",
                                                        "use_accent_color": false
                                                    }, {
                                                        "_uid": "77190fbb-89e3-4bad-a2f8-1131979ee99a",

                                                            "id": 15939607,
                                                            "alt": "The Jewel Inside Heinz Ketchup Ring",

                                                            "focus": "",

                                                                },

                                                                    "text": "Approach",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "A GASTRONOMIC SURPRISE",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "Asking for ketchup in a luxury restaurant is quite a risk. Not only can they deny it to you, but you might even offend the chef. And in Spain this poses a significant problem for Heinz lovers. Aligned with Heinz's global strategy, we needed to create a campaign that would generate a lot of buzz... A campaign that would leave Ferran Adria, Arzak, or Dabiz Muñoz (some of the most famous Spanish chefs in the world) speechless.",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }]
                                                        },

                                                                    "text": "Solution",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "EVERY FANS DREAM",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "We invented a wearable solution that allows people to sneak Heinz into places without being discovered: by creating the first ring that conceals and dispenses ketchup. It's a piece of jewelry designed specifically to be worn with class while breaking the chef's number one rule: no ketchup allowed.",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "type": "hard_break",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "text": "It is replenished with specially designed biodegradable Heinz ketchup capsules. Each one provides a single dose of the product, enough to turn a simple dish into the most delightful one. For the manufacturing of The Jewel Inside, we enlisted the help of a team of industrial engineers to create a 3d printed prototype, and the final pieces of jewelry were crafted by silversmiths using sterling silver. ",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "type": "hard_break",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }, {
                                                                    "text": "The custom-made ketchup capsules are also biodegradable and safe for food consumption and it took over three months to achieve a functional product for the campaign.",
                                                                    "type": "text",
                                                                    "marks": [{
                                                                        "type": "textStyle",
                                                                        "attrs": {
                                                                            "color": ""
                                                                        }
                                                                    }]
                                                                }]
                                                            }]

                                                        "quote": "The avant-garde electronic music festival, Jardim Sonoro, turned visual AI platform’s flaws into its 2022 edition artwork.",

                                                        "_uid": "9d98ac48-aba8-4dc9-8dbb-d39c13c231a4",

                                                                    "text": "Challenge ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "IMAGINING A NEW JARDIM SONORO",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "In 2022 Jardim Sonoro, an avant-garde, artistically and identitarily differentiated electronic music festival in Portugal, would make its comeback in a physical format after two years of pandemic, deepening its roots in an even more natural location. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "This edition had plenty of news to communicate. Jardim Sonoro flourished with a new concept 'Blended with nature' and camouflaged and merged even deeper in nature, moving its ground to Monsanto, the lung of Lisbon, reconnecting the city and its people with nature. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "We had to imagine and deliver the campaign for this new Jardim Sonoro, taking these transformations and its reinforced concept into account.",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph"
                                                            }]
                                                        },
                                                        "component": "rich_text",
                                                        "use_accent_color": false
                                                    }, {
                                                        "_uid": "a762d6f5-3f4b-46d2-a022-6c369f74be39",

                                                            "fieldtype": "asset",
                                                            "is_external_url": false

                                                        "component": "image_block",

                                                    }, {

                                                            "content": [{
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 6
                                                                },
                                                                "content": [{
                                                                    "text": "Solution ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "BLENDING ARTISTS WITH NATURE USING AI",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "To imagine and conceive a new campaign for Jardim Sonoro, now placed in a new forest venue, merged even deeper in nature, became a hard task. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "Assuming and remembering that great masterpieces are often born from error, we took advantage of the erratic interpretations of visual AI platforms so we could explore its flaws transforming them into something unique. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "We challenged the machine to give it a try and imagine the new Jardim Sonoro for us. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "Artists were blended with nature, featuring their most prominent characteristics whilst machine learning and art direction worked side by side, calibrating the search for the perfect prompts and the more exquisite outputs. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "The results were everything we never expected or imagined.",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },

                                                                "content": [{
                                                                    "text": "A MORAL DILEMMA",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "MEO, Portugal's top broadcaster and official sponsor of the national 2022 Qatar World Cup team, faced a dilemma.",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },
                                                        "component": "rich_text",

                                                        },
                                                        "caption": "Introducing the yellow jersey",
                                                        "component": "image_block",
                                                        "layout_size": "full-width",
                                                        "use_accent_color": false
                                                    }, {
                                                        "_uid": "341cd1b2-0b0f-4669-a28a-fa83e027422f",
                                                        "text": {
                                                            "type": "doc",
                                                            "content": [{
                                                                "type": "heading",

                                                                "content": [{

                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "INTRODUCING THE YELLOW JERSEY",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "Dentsu Creative partnered with Amnesty International to form the “Forgotten Team\", to raise awareness about human rights abuse and raise funds for the victims' families. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "The team jersey was inspired by the workers' vests, in electric yellow complete with reflective bands and the number 4 representing Article 4 of the Human Rights Act on the back, with a QR code to drive donations. ",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "Jerseys were distributed at football stadiums with the objective to create a symbol that would unite fans to support the cause, and distinctly stand out amongst the colourful and celebratory crowds at games. ",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },
                                                        "component": "rich_text",
                                                        "use_accent_color": false
                                                    }, {
                                                        "_uid": "47101778-245d-41be-820d-f56af654eb0a",

                                                            "alt": "The Forgotten Team - high vis team shirt",

                                                            "title": "",

                                                        "caption": "",

                                                        "layout_size": "large",
                                                        "use_accent_color": false
                                                    }, {
                                                        "_uid": "5081f509-ea33-4d89-9f31-3e3339aa78a8",
                                                        "text": {
                                                            "type": "doc",
                                                            "content": [{
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 6
                                                                },
                                                                "content": [{
                                                                    "text": "Results",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "heading",
                                                                "attrs": {
                                                                    "level": 4
                                                                },
                                                                "content": [{
                                                                    "text": "A SYMBOL OF BRAVERY AND VIRTUE",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "When football authorities banned the jersey from stadiums, it soon went on to become a symbol of bravery and virtue and ignited a rallying spirit.",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "The impact on the Portuguese people was immense, with the abuses in Qatar so close to the heart of a nation with many immigrants and overseas workers.",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "The campaign reached 98% of Portugal with more than 1.5M of earned media. It was the highest evaluated World Cup campaign with 78% approval rating, surpassing the evaluations of big sport, alcohol and fast food brands who sponsored.",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "The Forgotten Team continues to send jerseys to future World Cup hosts in an effort to ensure that workers' rights are not forgotten.",
                                                                    "type": "text"
                                                                }]
                                                            }, {
                                                                "type": "paragraph",
                                                                "content": [{
                                                                    "text": "It showed that a brand can stand for something more than just profits, and that people will support those who take a stand for what they believe in.",
                                                                    "type": "text"
                                                                }]
                                                            }]
                                                        },

                                            "type": "doc",
                                            "content": [{
                                                "type": "paragraph",
                                                "content": [{
                                                    "text": "Dentsu Creative Iberia encompasses the very best from Dentsu Creative Spain and Dentsu Creative Portugal. A fusion that unlocks unique synergies in the Iberian Peninsula.",
                                                    "type": "text"
                                                }]
                                            }, {
                                                "type": "paragraph",
                                                "content": [{
                                                    "text": "With offices in Madrid, Barcelona, and Lisbon we are strategically located to operate as a borderless team and unified entity, dedicated to the transformation of our clients’ businesses through transformative creativity.",
                                                    "type": "text"
                                                }]
                                            }, {
                                                "type": "paragraph",
                                                "content": [{
                                                    "text": "Our vision extends beyond advertising as we seek a more profound impact on people, business, and society. Thus, for each client and project we assemble the best multidisciplinary talent that, through an horizontal integration, assure the capabilities to intersect creative, media and customer experience management (CXM).",
                                                    "type": "text"
                                                }]
                                            }, {
                                                "type": "paragraph",
                                                "content": [{
                                                    "text": "At Dentsu Creative Iberia, we commit to the mandate of fuelling growth through the power of transformative creativity, addressing today’s challenges whilst setting the pace for tomorrow.",
                                                    "type": "text"
                                                }]
                                            }]
