name: Extract Reference Site Data

# Manual trigger only — go to the Actions tab and click "Run workflow"
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm-dev libasound2t64 || \
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm-dev libasound2

      - name: Run extraction script
        run: node extract.js

      - name: Upload extracted data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-site-data
          path: extracted/
          retention-days: 7
